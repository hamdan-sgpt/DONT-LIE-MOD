
[entities]

	[entities.moth]
		#How many moths required to destroy a torch - Disabled if set to 0
		#Range: > 0
		moths_to_destroy_torch = 5

		[entities.moth.spawning]
			#Enables natural spawning - More info on these options: https://minecraft.fandom.com/wiki/Spawn#Java_Edition
			spawn_naturally = true
			#The spawn weight compared to other entities (typically between 6-20)
			#Range: 1 ~ 9999
			spawn_weight = 10
			#Minimum amount of entities in spawned groups
			#Range: 1 ~ 9999
			minimum_group_size = 1
			#Maximum amount of entities in spawned groups - Must be greater or equal to min value
			#Range: 1 ~ 9999
			maximum_group_size = 3
			#Enter biome IDs. Supports modded biomes https://minecraft.fandom.com/wiki/Biome#Biome_IDs
			spawn_biomes = ["minecraft:swamp", "biomeswevegone:canadian_shield", "biomeswevegone:dacite_ridges", "biomeswevegone:forgotten_forest", "biomeswevegone:white_mangrove_marshes", "biomeswevegone:ebony_woods", "biomeswevegone:orchard", "biomeswevegone:overgrowth_woodlands", "biomeswevegone:sakura_grove", "biomeswevegone:skyris_vale", "biomeswevegone:enchanted_tangle", "biomeswevegone:cypress_wetlands", "biomeswevegone:aspen_boreal", "biomeswevegone:eroded_borealis", "minecraft:forest", "minecraft:mangrove_swamp", "biomeswevegone:bayou", "biomeswevegone:howling_peaks", "minecraft:old_growth_birch_forest", "biomeswevegone:cika_woods", "biomeswevegone:cypress_swamplands", "biomeswevegone:weeping_witch_forest", "minecraft:dark_forest", "biomeswevegone:frosted_coniferous_forest", "minecraft:grove", "biomeswevegone:zelkova_forest", "minecraft:flower_forest", "biomeswevegone:redwood_thicket", "minecraft:birch_forest", "biomeswevegone:black_forest", "biomeswevegone:coniferous_forest"]

			[entities.moth.spawning.spawn_costs]
				#Whether to use spawn costs in spawning or not
				use_spawn_costs = false
				#Cost to spawning algorithm per entity spawned
				#Range: 4.9E-324 ~ 1.7976931348623157E308
				cost_per_spawn = 1.0
				#Maximum cost the spawning algorithm can accrue for this entity
				#Range: 4.9E-324 ~ 1.7976931348623157E308
				maximum_cost_per_biome = 10.0
				#Enter biome IDs to use these costs in. Supports modded biomes. An empty list will use spawn_biomes https://minecraft.fandom.com/wiki/Biome#Biome_IDs
				spawn_cost_biomes = []

